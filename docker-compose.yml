services:
  nats:
    image: nats:latest
    container_name: nats-php-nats
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
      - "6222:6222"   # Cluster
    command: >
      -js
      -sd /data
      -m 8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm=false"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  nats-data:
